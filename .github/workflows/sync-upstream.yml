name: Sync upstream

# The merge logic lives once, in Droidtop/droidtop-platforms, pinned by commit
# (Droidtop/tracker#198). Only the schedule and the upstream are this
# repository's.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: Droidtop/droidtop-platforms/.github/workflows/sync-upstream.yml@ec3b589cf70fb6025dc9b0d31365d1a59460e87c
    with:
      upstream-url: https://github.com/RikkaApps/Shizuku.git
      upstream-branch: master
