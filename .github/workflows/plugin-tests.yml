name: Plugin tests

on:
  push:
    branches: [main]
    paths:
      - 'droidtop-plugin/**'
      - '.github/workflows/plugin-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install kotlinc
        run: |
          curl -sfL https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: RemoteProcessWait
        working-directory: droidtop-plugin
        run: |
          kotlinc src/dev/droidtop/plugins/shizuku/RemoteProcessWait.kt test/RemoteProcessWaitTest.kt -include-runtime -d "$RUNNER_TEMP/test.jar"
          java -cp "$RUNNER_TEMP/test.jar" RemoteProcessWaitTestKt
      - name: PackageRequests
        working-directory: droidtop-plugin
        run: |
          kotlinc src/dev/droidtop/plugins/shizuku/PackageRequests.kt test/PackageRequestsTest.kt -include-runtime -d "$RUNNER_TEMP/packages.jar"
          java -cp "$RUNNER_TEMP/packages.jar" PackageRequestsTestKt
      - name: SettingsRequests
        working-directory: droidtop-plugin
        run: |
          kotlinc src/dev/droidtop/plugins/shizuku/PackageRequests.kt src/dev/droidtop/plugins/shizuku/SettingsRequests.kt test/SettingsRequestsTest.kt -include-runtime -d "$RUNNER_TEMP/settings.jar"
          java -cp "$RUNNER_TEMP/settings.jar" SettingsRequestsTestKt
